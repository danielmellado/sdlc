# OpenShell sandbox policy for OpenCode.
# Mirrors nono/opencode.json network allowlist.
#
# Apply:  openshell policy set <sandbox> --policy openshell/policy-opencode.yaml --wait
# Or use: openshell-ai --opencode (wrapper in shell/ai-aliases.sh)

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom]
  read_write: [/tmp]

landlock:
  compatibility: best_effort

network_policies:
  # --- LLM providers ---
  anthropic:
    name: anthropic-api
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/opencode

  openai:
    name: openai-api
    endpoints:
      - host: api.openai.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/opencode

  opencode:
    name: opencode-services
    endpoints:
      - host: opencode.ai
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: api.opencode.ai
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/opencode

  vertex_ai:
    name: google-vertex-ai
    endpoints:
      - host: aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: global-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: us-central1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: europe-west1-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: generativelanguage.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/opencode

  google_auth:
    name: google-oauth
    endpoints:
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: accounts.google.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: www.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/opencode

  # --- CVE scanning (skopeo + curl) ---
  quay:
    name: quay-registry
    endpoints:
      - host: quay.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: cdn.quay.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: cdn01.quay.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: cdn02.quay.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: cdn03.quay.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/skopeo
      - path: /usr/bin/curl

  redhat:
    name: redhat-registries
    endpoints:
      - host: access.redhat.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: registry.redhat.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/skopeo
      - path: /usr/bin/curl

  # --- GitHub ---
  github:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/bin/opencode
      - path: /usr/bin/git
      - path: /usr/bin/gh

  # --- Package registries (read-only) ---
  registries:
    name: package-registries
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: proxy.golang.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: crates.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: static.crates.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/bin/opencode
      - path: /usr/bin/npm
      - path: /usr/bin/node
