# OpenShell sandbox policy for Claude Code.
# Mirrors nono/claude-code.json network allowlist.
#
# Apply:  openshell policy set <sandbox> --policy openshell/policy-claude.yaml --wait
# Or use: openshell-ai (wrapper in shell/ai-aliases.sh)

version: 1

filesystem_policy:
  include_workdir: true
  read_only: [/usr, /lib, /lib64, /etc, /proc, /dev/urandom]
  read_write: [/tmp]

landlock:
  compatibility: best_effort

network_policies:
  # --- LLM providers ---
  anthropic:
    name: anthropic-api
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/claude

  vertex_ai:
    name: google-vertex-ai
    endpoints:
      - host: aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: global-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: us-east5-aiplatform.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/claude

  google_auth:
    name: google-oauth
    endpoints:
      - host: oauth2.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: accounts.google.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: www.googleapis.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/local/bin/claude

  # --- GitHub ---
  github:
    name: github-api
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/git
      - path: /usr/bin/gh

  # --- Package registries (read-only) ---
  registries:
    name: package-registries
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
      - host: proxy.golang.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-only
    binaries:
      - path: /usr/local/bin/claude
      - path: /usr/bin/npm
      - path: /usr/bin/node

  # --- Claude Code telemetry ---
  telemetry:
    name: claude-telemetry
    endpoints:
      - host: statsigapi.net
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - path: /usr/local/bin/claude
